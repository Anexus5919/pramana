    number: Clause 5.6(a), as substituted in 2021
    cite: Regulation 5.6(a)
    page: 10
    quote: "by remitting the prescribed Technical Education Regulatory (TER) Charges as specified in the Approval Process Handbook through AICTE's payment gateway on the Web-Portal, failing which the application shall not be considered."
