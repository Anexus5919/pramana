# Verbatim provisions. `cite` is the short form shown on a basis tag.
provisions:
  # ---------------- AICTE Act, 1987 ----------------
  ACT-10-I:
    source: ACT
    number: Section 10(i)
    cite: AICTE Act s. 10(i)
    page: 7
    quote: "lay down norms and standards for courses, curricula, physical and instructional facilities, staff pattern, staff qualifications, quality instructions, assessment and examinations"
    verified: true
  ACT-10-K:
    source: ACT
    number: Section 10(k)
    cite: AICTE Act s. 10(k)
    page: 7
    quote: "grant approval for starting new technical institutions and for introduction of new courses or programmes in consultation with the agencies concerned"
    verified: true
  ACT-10-P:
    source: ACT
    number: Section 10(p)
    cite: AICTE Act s. 10(p)
    page: 7
    quote: "inspect or cause to inspect any technical institution"
    verified: true
  ACT-10-U:
    source: ACT
    number: Section 10(u)
    cite: AICTE Act s. 10(u)
    page: 8
    quote: "set up a National Board of Accreditation to periodically conduct evaluation of technical institutions or programmes on the basis of guidelines, norms and standards specified by it"
    verified: true

  # ---------------- Approval Regulations, 2020, and the 2021 amendment ----------------
  REG-2.9:
    source: REG2020
    number: Clause 2.9
    cite: Regulation 2.9
    page: 27
    quote: "\"Approved Intake\" means the maximum number of students that can be admitted in a Course (excluding the Supernumerary Seats) as approved by the Council."
    verified: true
  REG-5.6A-DSC:
    source: REG2021
    number: Clause 5.6(a), as substituted in 2021
