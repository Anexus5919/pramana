# Pramana regulatory basis: the provisions each finding concerns, and what an official should establish before
# acting on it. Shown to officers, verifiers and admins next to a finding; never to institutions.
#
# Every provision below was read in the official text and is quoted verbatim (a sentence or less). Page numbers
# are PDF page numbers of the file whose SHA-256 is recorded under sources. scripts/verify_regulatory_basis.py
# re-checks every quote against those files. A provision that could not be verified is left out, never
# paraphrased. Pramana does not decide whether a provision is breached; the competent authority does.

basis:
  id: pramana-regulatory-basis
  version: 2026-27.1
  ruleset: aicte-aph-2024-27
  verified_on: 2026-10-27
  scope_note: Provisions this finding concerns. Whether one is breached is for the competent authority.

