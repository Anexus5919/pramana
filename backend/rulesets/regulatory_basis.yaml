# What an official should establish before acting. basis: the provision that requires the step, or `evidence`
# when it is evidentiary good practice rather than a requirement of the text.
steps:
  issuer-original:
    text: Obtain the issuer's original certificate, or the issuer's written confirmation of what it issued.
    basis: evidence
  printed-differs:
    text: Confirm that the value printed on the submitted copy differs from what the issuer signed or holds on record.
    basis: evidence
  benign-cause:
    text: Rule out an ordinary cause, such as a comment, a template fill or a re-save that left the values unchanged.
    basis: evidence
  issuer-validity:
    text: Confirm the validity period with the issuer, through its registry, the signed QR code or a letter.
    basis: evidence
  renewal-on-date:
    text: Check whether a renewed certificate was in force on the date the application was submitted.
    basis: evidence
  issuer-holder:
    text: Confirm with the issuer which institution the certificate number was issued to.
    basis: evidence
  compare-peer:
    text: Compare the two applications' copies side by side and note which was submitted first.
    basis: evidence
  registry-roster:
    text: Check the faculty registry and both rosters, including the joining and relieving dates.
    basis: evidence
  faculty-presence:
    text: Ask for the salary statements of the faculty concerned, and confirm their presence at the institution.
    basis: APH-6.14A
  site-check:
    text: Verify the facility on site, or through an online visit by an Expert Visit Committee.
    basis: APH-ANX16.8-EVC
  original-photo:
    text: Ask for the original photographs, with their capture time and location.
    basis: evidence
  absent-check:
    text: Confirm on the portal that the document was not uploaded, and was not filed under another document type.
    basis: evidence
  open-file:
    text: Open the file and read the value from the page itself.
    basis: evidence
  record-check:
    text: Compare the declared value with AICTE's approval record for the previous year.
    basis: evidence
  recompute:
    text: Recompute the requirement from the approved intake and the handbook norm.
    basis: evidence
  ledger-check:
    text: Confirm the payment status and transaction in the AICTE payment ledger.
    basis: evidence
  dsc-check:
    text: Check who signed the file, whether it is intact since signing, and the certificate chain of the signature.
    basis: evidence
  source-retry:
    text: Complete the check through another channel; an unavailable or pending source says nothing about the document.
    basis: evidence
  read-line:
    text: Read the flagged line in the document and note which values it tries to supply.
    basis: evidence
  changed-item:
    text: Examine the changed item as a fresh submission; the earlier scrutiny did not cover it.
    basis: evidence
  previous-year:
    text: Compare with last year's application and ask the institution what changed.
    basis: evidence
  dates-check:
    text: Note the date the certificate lapses and whether it falls inside the session being approved.
    basis: evidence
  opportunity-comply:
    text: Give the institution an opportunity to comply with the deficiency.
    basis: APH-2.4
  opportunity-heard:
    text: Give the institution an opportunity to explain and to be heard.
    basis: REG-11.2
  record-reasons:
    text: Record the decision with reasons.
    basis: REG-7.4

# The handbook clause that requires each document type. Entries marked document_clause cite it first for a
# finding about one document, so a finding on the fire certificate relates to the fire certificate clause.
documents:
  affidavit_2: [APH-6.39]
  ter_receipt: [APH-ANX2.1-II]
  occupancy_certificate: [APH-6.17G, APH-AFF2-5]
  structural_stability: [APH-6.17H, APH-AFF2-5]
  fire_noc: [APH-6.17I, APH-AFF2-7]
  satellite_map: [APH-ANX2.1-VI, APH-AFF2-4]
  audited_accounts: [APH-ANX2.1-VII]
  faculty_list: [APH-AFF2-9]
  nba_certificate: [REG-6.3F]
  infrastructure_photo: [APH-2.5A]

# Entries by finding code. `codes` match exactly; `patterns` match code families with * wildcards. An exact code
# wins over a pattern, and a longer pattern over a shorter one. For rule findings the rule's own clause is
# already cited in the finding, so the provisions here are the related ones. Provisions run handbook,
# Regulations, Act, then what the texts provide when information or documents are found false.
entries:
  # ---------------- Rules: documents required by Annexure 2.1 ----------------
  - id: required-document-missing
    title: A required document is not uploaded
    codes: [APH-A21-AFFIDAVIT, APH-A21-TER-RECEIPT, APH-A21-FIRE, APH-A21-SATMAP, APH-A21-ACCOUNTS]
    provisions: [APH-2.3.4A, REG-5.6G, REG-11.4A, ACT-10-K]
    establish: [absent-check, opportunity-comply, record-reasons]

  - id: occupancy-certificate-missing
    title: Occupancy or Completion Certificate not uploaded
    codes: [APH-A21-OC]
    provisions: [APH-6.17G, APH-7.4J, REG-5.6G, REG-11.4I, ACT-10-I]
    establish: [absent-check, opportunity-comply, record-reasons]

  - id: structural-stability
    title: Structural Stability Certificate required or out of date
    codes: [APH-A21-SSC-REQUIRED, APH-617H-SSC-VALID]
    provisions: [APH-6.17H, APH-AFF2-5, REG-6.3A-NORMS, ACT-10-I]
    establish: [absent-check, issuer-validity, opportunity-comply, record-reasons]

  # ---------------- Rules: fire certificate ----------------
  - id: fire-certificate-validity
    title: Fire Safety Certificate not valid on the relevant date
    codes: [APH-617I-FIRE-VALID, APH-A31D-FIRE-BEFORE]
    provisions: [APH-ANX3.1D, APH-AFF2-7, REG-6.3A-NORMS, ACT-10-I]
    establish: [issuer-validity, renewal-on-date, opportunity-comply, record-reasons]

  - id: certificate-holder
    title: Fire or occupancy certificate names another institution
    codes: [XD-FIRE-INSTITUTION, XD-OC-INSTITUTION]
    document_clause: true
    provisions: [ACT-10-K, REG-9.3]
    establish: [issuer-holder, opportunity-heard, record-reasons]

  # ---------------- Rules: Affidavit 2 ----------------
  - id: affidavit-form
    title: Affidavit 2 form, signature or application
    codes: [APH-AFF2-FORM, APH-639-AFF2-DSC, XD-AFF2-APPLICATION]
    provisions: [APH-AFF1-NOTE, APH-1.4.6, REG-5.6H, ACT-10-K]
    establish: [open-file, dsc-check, opportunity-comply, record-reasons]

  # ---------------- Rules: TER and the application window ----------------
  - id: ter-payment
    title: TER payment and receipt
    codes: [APH-232D-TER-STATUS, XR-TER-RECEIPT-MATCH]
    provisions: [APH-ANX2.1-II, REG-5.6A-TER, REG-5.6B, ACT-10-K]
    establish: [ledger-check, opportunity-comply, record-reasons]

  - id: submission-window
    title: Application submitted after the notified last date
    codes: [PN2627-DEADLINE]
    provisions: [APH-1.4.3-DATE, REG-5.6B, ACT-10-K]
    establish: [record-check, record-reasons]

  # ---------------- Rules and history: intake ----------------
  - id: approved-intake
    title: Declared or proposed intake differs from the approved intake
    codes: [XR-INTAKE-RECORD, XR-EOA-NO-INCREASE, YOY-INTAKE-JUMP]
    provisions: [APH-2.6, APH-7.4G, REG-2.9, REG-11.4G, ACT-10-K]
    establish: [record-check, opportunity-comply, record-reasons]

  - id: core-branches
    title: Increase in intake without the required core branches
    codes: [ADD26-26C-CORE-BRANCHES]
    provisions: [APH-2.6C, APH-2.6, ACT-10-K]
    establish: [record-check, opportunity-comply, record-reasons]

  - id: nba-claims
    title: NBA accreditation claimed without a register entry
    codes: [XR-NBA-CLAIMS]
    provisions: [REG-6.3F, ACT-10-U, REG-9.3]
    establish: [record-check, opportunity-heard, record-reasons]

  # ---------------- Rules and history: land, building and location ----------------
  - id: built-up-area
    title: Built-up area, occupancy certificate and land
    codes: [XD-OC-AREA, YOY-BUILT-UP-AREA-DECREASED, YOY-LAND-AREA-DECREASED]
    provisions: [APH-6.17G, APH-AFF2-15, APH-7.4F, REG-11.4F, ACT-10-I, REG-11.7]
    establish: [previous-year, site-check, opportunity-heard, record-reasons]

  - id: admin-amenities-area
    title: Administrative and amenities area below the norm
    codes: [APH-ANX33-ADMIN-AREA]
    provisions: [APH-6.18, REG-11.4F, ACT-10-I]
    establish: [recompute, site-check, opportunity-comply, record-reasons]

  - id: campus-location
    title: Campus location on the satellite map
    codes: [XD-SATMAP-LOCATION]
    provisions: [APH-ANX2.1-VI, APH-AFF2-4, APH-7.4F, REG-11.4F, ACT-10-P]
    establish: [site-check, opportunity-heard, record-reasons]

  - id: audited-accounts
    title: Audited accounts of another entity or year
    codes: [XD-ACCOUNTS-ENTITY]
    provisions: [APH-ANX2.1-VII, APH-1.4.3, ACT-10-K]
    establish: [open-file, opportunity-comply, record-reasons]

  # ---------------- Rules: faculty and facilities ----------------
  - id: faculty-norms
    title: Faculty-student ratio
    codes: [APH-ANX5-FSR]
    provisions: [APH-6.14, APH-AFF2-9, APH-7.4C, REG-11.4C, ACT-10-I]
    establish: [recompute, registry-roster, opportunity-comply, record-reasons]

  - id: faculty-count
    title: Declared faculty count differs from the roster
    codes: [XD-FACULTY-COUNT]
    provisions: [APH-AFF2-9, APH-1.4.3, REG-9.1, ACT-10-I, REG-11.7]
    establish: [registry-roster, opportunity-comply, record-reasons]

  - id: facilities-norms
    title: Internet bandwidth, computers and laboratory equipment
    codes: [APH-ANX41-BANDWIDTH, PH-ROOM-FEW-WORKSTATIONS, PH-ROOM-TYPE-DIFFERS]
    provisions: [APH-6.19, APH-ANX4.1-5, REG-11.4D, ACT-10-I]
    establish: [site-check, opportunity-comply, record-reasons]

  # ---------------- Cross-application and history: faculty ----------------
  - id: faculty-elsewhere
    title: Faculty listed or registered at more than one institution
    codes: [XA-FACULTY-MULTIPLE-INSTITUTIONS, XA-FACULTY-REGISTERED-ELSEWHERE, XA-FACULTY-NOT-IN-REGISTRY,
            YOY-FACULTY-TURNOVER]
    provisions: [APH-AFF2-9, APH-6.14C, REG-9.1, ACT-10-I, REG-9.3]
    establish: [registry-roster, faculty-presence, opportunity-heard, record-reasons]

  # ---------------- Cross-application: shared certificates, files and seals ----------------
  - id: shared-certificate
    title: Certificate number, details, file or seal shared with another institution
    codes: [XA-SHARED-CERTIFICATE-NUMBER, XA-NEAR-DUPLICATE-DETAILS, XA-IDENTICAL-FILE, FX-SEAL-REUSED,
            FX-SEAL-REUSED-LATER]
    document_clause: true
    provisions: [APH-ANX16.8-SC, ACT-10-K, REG-9.3]
    establish: [issuer-holder, compare-peer, opportunity-heard, record-reasons]

  - id: certificate-number-reused
    title: Certificate number reused from last year with a new validity
    codes: [YOY-CERT-REUSED-NEW-VALIDITY]
    document_clause: true
    provisions: [APH-ANX16.8-SC, ACT-10-K, REG-9.3]
    establish: [issuer-validity, previous-year, opportunity-heard, record-reasons]

  # ---------------- Photographs and the campus ----------------
  - id: photo-reused
    title: The same photograph in another institution's application
    codes: [XA-PHOTO-REUSED, XA-PHOTO-REUSED-LATER]
    document_clause: true
    provisions: [APH-AFF2-4, APH-2.3.5A, REG-6.11, ACT-10-P, REG-9.3]
    establish: [original-photo, site-check, opportunity-heard, record-reasons]

  - id: photo-capture
    title: Photograph capture details or edits
    patterns: ["FX-IMG-*", "PH-C2PA-*"]
    document_clause: true
    provisions: [APH-AFF2-4, APH-2.3.5A, REG-6.11, ACT-10-P]
    establish: [original-photo, site-check, record-reasons]

  # ---------------- Issued documents: content changed after issue or signing ----------------
  - id: content-changed
    title: Content of an issued document changed after issue or signing
    codes: [FX-FIELD-OVERWRITTEN, VER-ISSUER_SIGNATURE-MISMATCH_DETECTED, VER-SIGNED_QR-MISMATCH_DETECTED]
    patterns: ["FX-PDF-*", "FX-ANNOT-*", "FX-FONT-*"]
    document_clause: true
    provisions: [APH-ANX16.8-SC, ACT-10-K, REG-9.3, APH-7.4A]
    establish: [issuer-original, printed-differs, benign-cause, opportunity-heard, record-reasons]

  - id: instruction-text
    title: Document text addressed to automated readers
    codes: [SEC-INSTRUCTION-TEXT]
    document_clause: true
    provisions: [APH-ANX16.8-SC, APH-1.4.3, ACT-10-K, REG-9.3]
    establish: [read-line, issuer-original, opportunity-heard, record-reasons]

  - id: issuer-signature-absent
    title: Issuer document without the issuer's signature, or only as an image
    codes: [VER-ISSUER-SIGNATURE-ABSENT, FX-IMAGE-ONLY-ISSUER-DOC]
    document_clause: true
    provisions: [APH-ANX16.8-SC, ACT-10-K]
    establish: [issuer-original, printed-differs, opportunity-comply, record-reasons]

  # ---------------- Verification results ----------------
  - id: issuer-check-mismatch
    title: Issuer source disagrees with the document
    patterns: ["VER-*-MISMATCH_DETECTED"]
    document_clause: true
    provisions: [APH-ANX16.8-SC, ACT-10-K, REG-9.3]
    establish: [issuer-original, printed-differs, opportunity-heard, record-reasons]

  - id: certificate-expired
    title: Issuer source shows the certificate expired
    patterns: ["VER-*-EXPIRED"]
    document_clause: true
    provisions: [APH-ANX16.8-SC, ACT-10-I]
    establish: [issuer-validity, renewal-on-date, opportunity-comply, record-reasons]

  - id: verification-incomplete
    title: Verification could not be completed
    patterns: ["VER-*-SOURCE_UNAVAILABLE", "VER-*-VERIFICATION_PENDING", "VER-*-MANUAL_REVIEW_REQUIRED"]
    document_clause: true
    provisions: [APH-ANX16.8-SC, ACT-10-K]
    establish: [source-retry, issuer-original, record-reasons]

  - id: applicant-signature
    title: The applicant's digital signature on an upload
    patterns: ["VER-APPLICANT_SIGNATURE-*"]
    document_clause: true
    provisions: [APH-ANX2.1-LEAD, APH-1.4.6, REG-5.6A-DSC, ACT-10-K]
    establish: [dsc-check, opportunity-comply, record-reasons]

  - id: session-expiry
    title: Certificate lapses during the session being approved
    codes: [XD-CERT-EXPIRES-IN-SESSION]
    document_clause: true
    provisions: [REG-6.3A-NORMS, ACT-10-I]
    establish: [dates-check, issuer-validity, record-reasons]

  # ---------------- Reading the documents ----------------
  - id: document-reading
    title: A document or value could not be read with confidence
    codes: [DOC-PROCESSING-FAILED, DOC-UNREADABLE, DOC-SCRIPT-NOT-READ, FIELD-UNCERTAIN, DOC-TYPE-MISMATCH,
            FX-ANNOT-UNREAD]
    document_clause: true
    provisions: [APH-ANX16.8-SC, APH-2.3.4A]
    establish: [open-file, opportunity-comply, record-reasons]

  # ---------------- Rectification rounds ----------------
  - id: rectification-scope
    title: Change made outside the rectification request
    patterns: ["RECT-*"]
    provisions: [APH-2.4, APH-1.4.3, REG-6.3N, REG-5.6D]
    establish: [changed-item, opportunity-comply, record-reasons]
