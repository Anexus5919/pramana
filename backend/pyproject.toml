[project]
name = "pramana"
version = "0.1.0"
description = "Evidence-linked application validation, document authentication and compliance assistance for AICTE approval processing"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0",
    "pypdf>=5.1",
    "pikepdf>=9.4",
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "pyhanko>=0.25",
    "pyhanko-certvalidator>=0.26",
    "cryptography>=43",
    "pillow>=11",
    "imagehash>=4.3",
    "opencv-python-headless>=4.10",
    "numpy>=2.0",
    "networkx>=3.4",
    "rapidfuzz>=3.10",
    "python-dateutil>=2.9",
    "argon2-cffi>=23.1",
    "reportlab>=4.2",
    "segno>=1.6",
    "rapidocr>=3.4",
    "onnxruntime>=1.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28", "ruff>=0.8", "uharfbuzz>=0.50", "fonttools>=4.50"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pramana"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["B008", "E501"]
