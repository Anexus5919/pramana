<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pramana: evidence-linked approval scrutiny prototype. Decision support only." />
    <title>Pramana</title>
    <script>
      try {
        var h = document.documentElement;
        var t = localStorage.getItem("pramana-theme");
        if (t === "dark") h.classList.add("dark");
        var z = localStorage.getItem("pramana-text-size");
        if (z === "sm" || z === "lg") h.dataset.textSize = z;
        if (localStorage.getItem("pramana-contrast") === "high") h.dataset.contrast = "high";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
